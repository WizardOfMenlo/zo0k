[package]
name = "zo0k"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Zero-knowledge IOPP for constrained interleaved Reed-Solomon codes: reference implementation"
license = "Apache-2.0"
readme = "README.md"
keywords = ["zero-knowledge", "iop", "reed-solomon", "polynomial-commitment", "cryptography"]
categories = ["cryptography"]
default-run = "zo0k"

[dependencies]

[[bin]]
name = "zo0k"
path = "src/bin/zo0k/main.rs"

[[bin]]
name = "sim"
path = "src/bin/sim/main.rs"

[[bin]]
name = "lint"
path = "src/bin/lint/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"

# The tests compute proofs, which is slow without optimization.
[profile.test]
opt-level = 2
